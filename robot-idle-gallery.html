<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>等待不是待机：5 种 90 秒空白动作形态</title>
  <style>
    :root {
      --bg: #0f1117;
      --panel: #161a22;
      --border: #2a3040;
      --text: #e8ebf0;
      --muted: #8b93a7;
      --accent: #4a9eff;
      --accent-2: #6ee7b7;
      --danger: #f87171;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }

    header {
      max-width: 1200px;
      margin: 0 auto 24px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 24px;
      font-weight: 600;
    }

    .subtitle {
      color: var(--muted);
      font-size: 14px;
    }

    .tabs {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      max-width: 1200px;
      margin: 0 auto 20px;
    }

    .tab {
      padding: 10px 18px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--panel);
      color: var(--muted);
      cursor: pointer;
      font-size: 14px;
      transition: all 0.2s ease;
    }

    .tab:hover { border-color: var(--accent); color: var(--text); }
    .tab.active { border-color: var(--accent); color: var(--text); background: rgba(74, 158, 255, 0.12); }

    .main {
      display: grid;
      grid-template-columns: 1fr 360px;
      gap: 20px;
      max-width: 1200px;
      margin: 0 auto;
    }

    @media (max-width: 900px) {
      .main { grid-template-columns: 1fr; }
    }

    .stage {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      min-height: 420px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    .stage-label {
      position: absolute;
      top: 16px;
      left: 16px;
      font-size: 13px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .timer {
      position: absolute;
      top: 16px;
      right: 16px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 16px;
      color: var(--accent);
    }

    /* Robot */
    .robot {
      position: relative;
      width: 120px;
      height: 240px;
      transition: transform 0.6s ease;
    }

    .robot-head {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: linear-gradient(180deg, #d1d5db 0%, #9ca3af 100%);
      border: 2px solid #6b7280;
      transition: transform 0.6s ease;
      z-index: 3;
    }

    .face {
      position: absolute;
      top: 18px;
      left: 10px;
      right: 10px;
      display: flex;
      justify-content: space-between;
    }

    .eye {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 8px var(--accent);
      transition: opacity 0.3s ease;
    }

    .eye.blink { opacity: 0.1; }

    .neck {
      position: absolute;
      top: 54px;
      left: 50%;
      transform: translateX(-50%);
      width: 16px;
      height: 20px;
      background: #6b7280;
      z-index: 2;
    }

    .torso {
      position: absolute;
      top: 72px;
      left: 50%;
      transform: translateX(-50%);
      width: 68px;
      height: 88px;
      border-radius: 12px;
      background: linear-gradient(180deg, #4b5563 0%, #374151 100%);
      border: 2px solid #4b5563;
      z-index: 2;
      transition: transform 0.6s ease;
      transform-origin: center bottom;
    }

    .chest {
      position: absolute;
      top: 14px;
      left: 50%;
      transform: translateX(-50%);
      width: 40px;
      height: 24px;
      border-radius: 4px;
      background: rgba(74, 158, 255, 0.2);
      border: 1px solid rgba(74, 158, 255, 0.4);
    }

    .shoulder {
      position: absolute;
      top: 80px;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #6b7280;
      z-index: 1;
    }
    .shoulder.left { left: 14px; }
    .shoulder.right { right: 14px; }

    .arm {
      position: absolute;
      top: 92px;
      width: 12px;
      height: 56px;
      border-radius: 6px;
      background: #6b7280;
      transform-origin: top center;
      transition: transform 0.6s ease;
      z-index: 1;
    }
    .arm.left { left: 18px; }
    .arm.right { right: 18px; }

    .forearm {
      position: absolute;
      top: 48px;
      left: 0;
      width: 12px;
      height: 44px;
      border-radius: 6px;
      background: #9ca3af;
      transform-origin: top center;
      transition: transform 0.6s ease;
    }

    .base {
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 80px;
      height: 36px;
      border-radius: 10px 10px 4px 4px;
      background: #1f2937;
      border: 2px solid #374151;
      z-index: 0;
    }

    .base-glow {
      position: absolute;
      bottom: 8px;
      left: 50%;
      transform: translateX(-50%);
      width: 40px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
      opacity: 0.4;
      filter: blur(6px);
    }

    /* Animations */
    @keyframes headScan {
      0%, 100% { transform: translateX(-50%) rotateY(0deg); }
      25% { transform: translateX(-50%) rotateY(-22deg); }
      75% { transform: translateX(-50%) rotateY(22deg); }
    }
    .head-scan .robot-head { animation: headScan 4s ease-in-out infinite; }

    @keyframes headScanWide {
      0%, 100% { transform: translateX(-50%) rotateY(0deg); }
      25% { transform: translateX(-50%) rotateY(-28deg); }
      75% { transform: translateX(-50%) rotateY(28deg); }
    }
    .head-scan-wide .robot-head { animation: headScanWide 4s ease-in-out infinite; }

    @keyframes torsoBreathe {
      0%, 100% { transform: translateX(-50%) scaleY(1) translateY(0); }
      50% { transform: translateX(-50%) scaleY(1.03) translateY(-2px); }
    }
    .torso-breathe .torso { animation: torsoBreathe 4s ease-in-out infinite; }

    @keyframes weightShiftLeft {
      0%, 100% { transform: translateX(0); }
      50% { transform: translateX(-10px) rotateZ(-2deg); }
    }
    .weight-left { animation: weightShiftLeft 4s ease-in-out infinite; }

    @keyframes weightShiftRight {
      0%, 100% { transform: translateX(0); }
      50% { transform: translateX(10px) rotateZ(2deg); }
    }
    .weight-right { animation: weightShiftRight 4s ease-in-out infinite; }

    @keyframes gazeDrop {
      0%, 100% { transform: translateX(-50%) rotateX(0deg); }
      50% { transform: translateX(-50%) rotateX(18deg); }
    }
    .head-gaze .robot-head { animation: gazeDrop 4s ease-in-out infinite; }

    @keyframes touchRight {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(-35deg) translateY(8px); }
    }
    @keyframes forearmRight {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(-55deg); }
    }
    .touch-right .arm.right { animation: touchRight 3s ease-in-out infinite; }
    .touch-right .arm.right .forearm { animation: forearmRight 3s ease-in-out infinite; }

    @keyframes touchLeft {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(35deg) translateY(8px); }
    }
    @keyframes forearmLeft {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(55deg); }
    }
    .touch-left .arm.left { animation: touchLeft 3s ease-in-out infinite; }
    .touch-left .arm.left .forearm { animation: forearmLeft 3s ease-in-out infinite; }

    @keyframes microTurn {
      0%, 100% { transform: translateX(-50%) rotateY(0deg); }
      50% { transform: translateX(-50%) rotateY(10deg); }
    }
    .torso-turn .torso { animation: microTurn 3s ease-in-out infinite; }
    .head-turn .robot-head { animation: headScan 2.5s ease-in-out infinite; }

    @keyframes resetSettle {
      0% { transform: translateY(-2px); }
      100% { transform: translateY(0); }
    }
    .robot-settle { animation: resetSettle 1s ease-out forwards; }

    /* Sidebar */
    .sidebar {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
    }

    .card h3 {
      margin: 0 0 12px;
      font-size: 14px;
      font-weight: 600;
      color: var(--accent);
    }

    .current-segment {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .current-desc {
      color: var(--muted);
      font-size: 13px;
    }

    .segment-list {
      max-height: 320px;
      overflow-y: auto;
      padding-right: 4px;
    }

    .segment {
      display: flex;
      gap: 10px;
      padding: 8px 0;
      border-bottom: 1px solid var(--border);
      font-size: 13px;
      opacity: 0.55;
      transition: opacity 0.2s;
    }
    .segment:last-child { border-bottom: none; }
    .segment.active { opacity: 1; }
    .segment.active .seg-time { color: var(--accent); }
    .segment.active .seg-name { color: var(--text); font-weight: 600; }

    .seg-time {
      width: 48px;
      flex-shrink: 0;
      color: var(--muted);
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    .seg-name { flex: 1; color: var(--text); }
    .seg-desc { color: var(--muted); }

    /* Controls */
    .controls {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .btn {
      padding: 8px 16px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      cursor: pointer;
      font-size: 13px;
      transition: all 0.2s;
    }
    .btn:hover { border-color: var(--accent); }
    .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }

    .progress-wrap {
      margin-top: 12px;
    }
    .progress-label {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 6px;
    }
    .progress-track {
      height: 6px;
      border-radius: 3px;
      background: var(--bg);
      overflow: hidden;
    }
    .progress-bar {
      height: 100%;
      width: 0%;
      background: var(--accent);
      transition: width 0.1s linear;
    }

    .form-desc {
      font-size: 13px;
      color: var(--muted);
      line-height: 1.6;
    }

    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 10px 14px;
      font-size: 12px;
      color: var(--muted);
      margin-top: 8px;
    }
    .legend span { display: flex; align-items: center; gap: 6px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; }
    .dot.scan { background: var(--accent); }
    .dot.breathe { background: var(--accent-2); }
    .dot.weight { background: #fbbf24; }
    .dot.gaze { background: #a78bfa; }
    .dot.touch { background: #f87171; }
    .dot.turn { background: #fb923c; }
    .dot.reset { background: #9ca3af; }
  </style>
</head>
<body>
  <header>
    <h1>等待不是待机：5 种 90 秒空白动作形态</h1>
    <div class="subtitle">人形机器人在无人对话时的“安静在场”状态，每种形态循环播放 90 秒，可点击下方标签切换。</div>
  </header>

  <nav class="tabs" id="tabs"></nav>

        <div class="robot-head">
          <div class="face">
            <div class="eye left"></div>
            <div class="eye right"></div>
          </div>
        </div>
        <div class="neck"></div>
        <div class="torso">
          <div class="chest"></div>
        </div>
        <div class="shoulder left"></div>
        <div class="shoulder right"></div>
        <div class="arm left"><div class="forearm left"></div></div>
        <div class="arm right"><div class="forearm right"></div></div>
        <div class="base"><div class="base-glow"></div></div>
      </div>
    </div>

    <div class="sidebar">
      <div class="card">
        <h3 id="form-title">形态名称</h3>
        <div class="form-desc" id="form-desc">形态描述</div>
      </div>

      <div class="card">
        <h3>当前动作</h3>
        <div class="current-segment" id="current-name">-</div>
        <div class="current-desc" id="current-desc">-</div>
      </div>

      <div class="card">
        <h3>90 秒时间轴</h3>
        <div class="segment-list" id="segment-list"></div>
      </div>

      <div class="card">
        <h3>控制</h3>

          <button class="btn" id="reset-btn">重播</button>

        <div class="progress-wrap">

          <div class="progress-track"><div class="progress-bar" id="progress-bar"></div></div>

      </div>
    </div>
  </div>

          { start: 54, end: 60, action: 'weightLeft', name: '重心微移', desc: '重心再次左移' },
          { start: 60, end: 66, action: 'touchRight', name: '指尖触碰', desc: '再次自我触摸' },
          { start: 66, end: 74, action: 'breathe', name: '呼吸静止', desc: '深度放松' },
          { start: 74, end: 80, action: 'weightRight', name: '重心微移', desc: '重心右移' },
          { start: 80, end: 86, action: 'touchLeft', name: '指尖触碰', desc: '整理姿态' },
          { start: 86, end: 90, action: 'reset', name: '复位', desc: '回到等待姿态' },
        ],
      },
      {
        id: 'balanced',
        name: '平衡综合者',
        desc: '标准 90 秒循环，观察、休息、好奇、自我调适四个阶段均衡分布，适合通用场景。',
        segments: [
          { start: 0, end: 5, action: 'scan', name: '环境扫描', desc: '头部左右扫视' },
          { start: 5, end: 12, action: 'breathe', name: '呼吸静止', desc: '胸部缓慢起伏' },
          { start: 12, end: 17, action: 'weightLeft', name: '重心微移', desc: '重心左移' },
          { start: 17, end: 26, action: 'breathe', name: '呼吸静止', desc: '进入安静' },
          { start: 26, end: 30, action: 'gaze', name: '视线低垂', desc: '头部下俯' },
          { start: 30, end: 34, action: 'touchRight', name: '指尖触碰', desc: '右手轻触左前臂' },
          { start: 34, end: 40, action: 'breathe', name: '呼吸静止', desc: '维持低能量' },
          { start: 40, end: 46, action: 'scanWide', name: '宽幅扫描', desc: '抬头并扩大扫描' },
          { start: 46, end: 50, action: 'turn', name: '微转向', desc: '向右侧声源转动' },
          { start: 50, end: 57, action: 'breathe', name: '呼吸静止', desc: '保持观察后姿态' },
          { start: 57, end: 62, action: 'gaze', name: '视线低垂', desc: '短暂低头' },
          { start: 62, end: 66, action: 'reset', name: '复位', desc: '回到中立位' },
          { start: 66, end: 73, action: 'weightRight', name: '重心微移', desc: '重心右移' },
          { start: 73, end: 79, action: 'breathe', name: '呼吸静止', desc: '安静' },
          { start: 79, end: 84, action: 'touchLeft', name: '指尖触碰', desc: '左手轻触右臂' },
          { start: 84, end: 87, action: 'reset', name: '复位', desc: '小幅回中' },
          { start: 87, end: 90, action: 'breathe', name: '呼吸静止', desc: '回到开放等待姿态' },
        ],
      },
    ];

    let currentFormIndex = 0;
    let isPlaying = true;
    let startTime = performance.now();
    let elapsed = 0;
    let rafId = null;

    const tabsEl = document.getElementById('tabs');
    const robotEl = document.getElementById('robot');
    const timerEl = document.getElementById('timer');
    const formTitleEl = document.getElementById('form-title');
    const formDescEl = document.getElementById('form-desc');
    const currentNameEl = document.getElementById('current-name');
    const currentDescEl = document.getElementById('current-desc');
    const segmentListEl = document.getElementById('segment-list');
    const playBtn = document.getElementById('play-btn');
    const resetBtn = document.getElementById('reset-btn');
    const progressBar = document.getElementById('progress-bar');
    const progressText = document.getElementById('progress-text');

    function buildTabs() {
      tabsEl.innerHTML = '';
      forms.forEach((form, idx) => {
        const btn = document.createElement('button');
        btn.className = 'tab' + (idx === currentFormIndex ? ' active' : '');
        btn.textContent = form.name;
        btn.onclick = () => switchForm(idx);
        tabsEl.appendChild(btn);
      });
    }

    function buildSegmentList() {
      segmentListEl.innerHTML = '';
      const form = forms[currentFormIndex];
      form.segments.forEach((seg, idx) => {
        const div = document.createElement('div');
        div.className = 'segment';
        div.id = `seg-${idx}`;
        div.innerHTML = `
          <div class="seg-time">${seg.start}-${seg.end}s</div>
          <div>
            <div class="seg-name">${seg.name}</div>
            <div class="seg-desc">${seg.desc}</div>
          </div>
        `;
        segmentListEl.appendChild(div);
      });
    }

    function formatTime(t) {
      const sec = Math.floor(t);
      const dec = Math.floor((t - sec) * 10);
      return `${sec.toString().padStart(2, '0')}.${dec}s`;
    }

    function applyAction(actionKey) {
      robotEl.className = 'robot';
      const classes = actionClasses[actionKey] || [];
      classes.forEach((cls) => robotEl.classList.add(cls));
    }

    function updateUI(t) {
      const form = forms[currentFormIndex];
      const progress = Math.min(t / 90, 1) * 100;
      progressBar.style.width = `${progress}%`;
      progressText.textContent = `${Math.round(progress)}%`;
      timerEl.textContent = formatTime(t);

      const segment = form.segments.find((s) => t >= s.start && t < s.end) || form.segments[form.segments.length - 1];
      currentNameEl.textContent = segment.name;
      currentDescEl.textContent = segment.desc;

      form.segments.forEach((s, idx) => {
        const el = document.getElementById(`seg-${idx}`);
        if (!el) return;
        el.classList.toggle('active', t >= s.start && t < s.end);
        if (el.classList.contains('active')) {
          el.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
        }
      });

      applyAction(segment.action);
    }

    function loop(now) {
      if (!isPlaying) return;
      elapsed = (now - startTime) / 1000;
      const t = elapsed % 90;
      updateUI(t);
      rafId = requestAnimationFrame(loop);
    }

    function switchForm(idx) {
      currentFormIndex = idx;
      startTime = performance.now();
      elapsed = 0;
      buildTabs();
      const form = forms[currentFormIndex];
      formTitleEl.textContent = form.name;
      formDescEl.textContent = form.desc;
      buildSegmentList();
      updateUI(0);
    }

    playBtn.addEventListener('click', () => {
      isPlaying = !isPlaying;
      playBtn.textContent = isPlaying ? '暂停' : '播放';
      if (isPlaying) {
        startTime = performance.now() - elapsed * 1000;
        rafId = requestAnimationFrame(loop);
      } else {
        cancelAnimationFrame(rafId);
      }
    });

    resetBtn.addEventListener('click', () => {
      startTime = performance.now();
      elapsed = 0;
      if (!isPlaying) {
        isPlaying = true;
        playBtn.textContent = '暂停';
        rafId = requestAnimationFrame(loop);
      }
    });

    // Blink eyes occasionally
    setInterval(() => {
      const eyes = document.querySelectorAll('.eye');
      eyes.forEach((eye) => eye.classList.add('blink'));
      setTimeout(() => eyes.forEach((eye) => eye.classList.remove('blink')), 150);
    }, 4000 + Math.random() * 2000);

    switchForm(0);
    rafId = requestAnimationFrame(loop);
  </script>
</body>
</html>
